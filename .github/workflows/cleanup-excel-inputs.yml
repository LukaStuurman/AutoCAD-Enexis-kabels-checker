name: Clean embedded Excel inputs

on:
  push:
    branches:
      - feature/v1.10.1-ui-excel-rounding

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.10.1-ui-excel-rounding
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean workbook input cells
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'clean-excel'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          dotnet new console --framework net8.0 --force | Out-Null
          dotnet add package ClosedXML --version 0.105.1 | Out-Null
          @'
          using ClosedXML.Excel;

          var repo = Environment.GetEnvironmentVariable("GITHUB_WORKSPACE")!;
          var res = Path.Combine(repo, "src", "Enexis.KabelChecker.AutoCAD", "Resources");

          CleanLegacy(Path.Combine(res, "Eea-0205.K 1.0 - Copy.xlsx"), 5, 36, 17, 34);
          CleanLegacy(Path.Combine(res, "Eea-0205.K_2.0.xlsx"), 5, 43, 18, 37);
          Clean2026(Path.Combine(res, "Eea-0205.K 3.2.xlsx"));

          static void CleanLegacy(string path, int countFirstRow, int countLastRow, int controlFirstRow, int controlLastRow)
          {
              using var wb = new XLWorkbook(path);
              foreach (var sheetName in new[] { "Ontwerpstroom_kabel", "Ontwerpstroom_trafo" })
              {
                  var ws = wb.Worksheet(sheetName);
                  for (var row = countFirstRow; row <= countLastRow; row++)
                      ws.Cell(row, 1).Clear(XLClearOptions.Contents);
              }

              foreach (var sheetName in new[] { "Controle_kabel_evenredig", "Controle_kabel_laatste_helft" })
              {
                  var ws = wb.Worksheet(sheetName);
                  for (var row = controlFirstRow; row <= controlLastRow; row++)
                      ws.Cell(row, 17).Clear(XLClearOptions.Contents);
              }

              wb.SaveAs(path);
          }

          static void Clean2026(string path)
          {
              using var wb = new XLWorkbook(path);
              for (var number = 1; number <= 12; number++)
              {
                  var ws = wb.Worksheet($"({number})");
                  for (var row = 5; row <= 79; row++)
                      ws.Cell(row, 2).Clear(XLClearOptions.Contents);
                  for (var row = 18; row <= 36; row++)
                      ws.Cell(row, 30).Clear(XLClearOptions.Contents);
                  for (var row = 64; row <= 82; row++)
                      ws.Cell(row, 30).Clear(XLClearOptions.Contents);
              }

              wb.SaveAs(path);
          }
          '@ | Set-Content -Path Program.cs -Encoding UTF8
          dotnet run -c Release
          Pop-Location

      - name: Commit cleaned templates and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/Enexis.KabelChecker.AutoCAD/Resources/*.xlsx"
          git rm ".github/workflows/cleanup-excel-inputs.yml"
          git commit -m "chore: store clean Excel templates"
          git push origin HEAD:feature/v1.10.1-ui-excel-rounding
