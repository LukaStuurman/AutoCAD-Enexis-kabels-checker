name: Core Excel reference check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Excel reference cases
        run: dotnet run --project tools/VerifyExcelCases/VerifyExcelCases.csproj -c Release

      - name: Build AutoCAD plugin including Excel export
        run: dotnet build src/Enexis.KabelChecker.AutoCAD/Enexis.KabelChecker.AutoCAD.csproj -c Release -p:UseAutoCADNuGet=true

      - name: Verify required .NET runtime dependency packaging
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'EnexisRuntimeDependencyCheck'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          & 'build\CopyDotNetRuntimeDependencies.ps1' -Destination $target
          if (-not (Test-Path (Join-Path $target 'System.IO.Compression.Brotli.dll'))) {
            throw 'System.IO.Compression.Brotli.dll kon niet voor de bundle worden verpakt.'
          }
