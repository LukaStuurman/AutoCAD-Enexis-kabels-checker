name: Build AutoCAD installer release

on:
  push:
    branches: [ main ]
    paths:
      - release-version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release-version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'release-version.txt is leeg.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify Excel reference cases
        shell: pwsh
        run: dotnet run --project tools/VerifyExcelCases/VerifyExcelCases.csproj -c Release

      - name: Build AutoCAD 2025/2026 .NET 8 plugin
        shell: pwsh
        run: dotnet build src/Enexis.KabelChecker.AutoCAD/Enexis.KabelChecker.AutoCAD.csproj -c Release -p:UseAutoCADNuGet=true -p:AutoCADApiSeries=R25

      - name: Build AutoCAD 2027+ .NET 10 plugin
        shell: pwsh
        run: dotnet build src/Enexis.KabelChecker.AutoCAD/Enexis.KabelChecker.AutoCAD.csproj -c Release -p:UseAutoCADNuGet=true -p:AutoCADApiSeries=R26

      - name: Make installable ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $releaseName = "EnexisKabelChecker-AutoCAD-2025-plus-v$version"
          $releaseRoot = Join-Path 'dist' $releaseName
          $bundle = Join-Path $releaseRoot 'EnexisKabelChecker.bundle'
          $contentsNet8 = Join-Path $bundle 'Contents\Windows\net8'
          $contentsNet10 = Join-Path $bundle 'Contents\Windows\net10'
          $outputNet8 = 'src\Enexis.KabelChecker.AutoCAD\bin\Release\net8.0-windows'
          $outputNet10 = 'src\Enexis.KabelChecker.AutoCAD\bin\Release\net10.0-windows'

          if (Test-Path 'dist') { Remove-Item 'dist' -Recurse -Force }
          New-Item -ItemType Directory -Path $contentsNet8 -Force | Out-Null
          New-Item -ItemType Directory -Path $contentsNet10 -Force | Out-Null

          Copy-Item 'build\PackageContents.xml' (Join-Path $bundle 'PackageContents.xml') -Force
          Copy-Item (Join-Path $outputNet8 '*.dll') $contentsNet8 -Force
          Copy-Item (Join-Path $outputNet10 '*.dll') $contentsNet10 -Force

          & 'build\CopyDotNetRuntimeDependencies.ps1' -Destination $contentsNet8 -RuntimeMajor 8
          & 'build\CopyDotNetRuntimeDependencies.ps1' -Destination $contentsNet10 -RuntimeMajor 10

          Copy-Item 'build\INSTALLEREN.bat' $releaseRoot -Force
          Copy-Item 'build\VERWIJDEREN.bat' $releaseRoot -Force
          Copy-Item 'build\LEESMIJ.txt' $releaseRoot -Force

          $zip = Join-Path 'dist' "$releaseName.zip"
          Compress-Archive -Path "$releaseRoot\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) { throw 'Release-ZIP is niet aangemaakt.' }
          foreach ($target in @(
            @{ Name = '.NET 8'; Path = $contentsNet8 },
            @{ Name = '.NET 10'; Path = $contentsNet10 }
          )) {
            foreach ($required in @(
              'Enexis.KabelChecker.AutoCAD.dll',
              'Enexis.KabelChecker.Core.dll',
              'ClosedXML.dll',
              'System.IO.Compression.Brotli.dll'
            )) {
              if (-not (Test-Path (Join-Path $target.Path $required))) {
                throw "$required ontbreekt in de $($target.Name)-bundle."
              }
            }
          }

          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Gemaakt: $zip"
          Get-ChildItem $releaseRoot -Recurse | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnexisKabelChecker-AutoCAD-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $zip = '${{ steps.package.outputs.zip }}'
          $title = "Enexis Kabel Checker v$version - AutoCAD 2025/2026/2027+"
          $notes = @"
          Makkelijk installeerbare AutoCAD-release voor Windows 64-bit.

          Compatibiliteit:
          - AutoCAD 2025/2026: .NET 8-build tegen AutoCAD API R25.
          - AutoCAD 2027 en nieuwer: .NET 10-build tegen AutoCAD API R26.0. Latere versies worden door de bundle toegelaten zolang Autodesk binary compatibility behoudt.

          Installeren:
          1. Download en pak de ZIP uit.
          2. Sluit AutoCAD.
          3. Dubbelklik INSTALLEREN.bat en bevestig de UAC-melding.
          4. Start AutoCAD opnieuw.
          5. Typ ENEXISKABELCHECK.

          De ZIP bevat beide gecompileerde pluginvarianten; AutoCAD kiest via PackageContents.xml automatisch de juiste DLL.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title $title --notes $notes
          }
