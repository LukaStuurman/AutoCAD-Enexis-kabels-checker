name: Build AutoCAD installer release

on:
  push:
    branches: [ release/v1.8.0-excel-richtingen ]
    paths:
      - release-version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release-version.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'release-version.txt is leeg.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify Excel reference cases
        shell: pwsh
        run: dotnet run --project tools/VerifyExcelCases/VerifyExcelCases.csproj -c Release

      - name: Build AutoCAD 2025-compatible plugin
        shell: pwsh
        run: dotnet build src/Enexis.KabelChecker.AutoCAD/Enexis.KabelChecker.AutoCAD.csproj -c Release -p:UseAutoCADNuGet=true

      - name: Make installable ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $releaseName = "EnexisKabelChecker-AutoCAD-2025-2026-v$version"
          $releaseRoot = Join-Path 'dist' $releaseName
          $bundle = Join-Path $releaseRoot 'EnexisKabelChecker.bundle'
          $contents = Join-Path $bundle 'Contents\Windows'
          $output = 'src\Enexis.KabelChecker.AutoCAD\bin\Release\net8.0-windows'

          if (Test-Path 'dist') { Remove-Item 'dist' -Recurse -Force }
          New-Item -ItemType Directory -Path $contents -Force | Out-Null

          Copy-Item 'build\PackageContents.xml' (Join-Path $bundle 'PackageContents.xml') -Force
          Copy-Item (Join-Path $output '*.dll') $contents -Force
          Copy-Item 'build\INSTALLEREN.bat' $releaseRoot -Force
          Copy-Item 'build\VERWIJDEREN.bat' $releaseRoot -Force
          Copy-Item 'build\LEESMIJ.txt' $releaseRoot -Force

          $zip = Join-Path 'dist' "$releaseName.zip"
          Compress-Archive -Path "$releaseRoot\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip)) { throw 'Release-ZIP is niet aangemaakt.' }
          if (-not (Test-Path (Join-Path $contents 'Enexis.KabelChecker.AutoCAD.dll'))) { throw 'AutoCAD DLL ontbreekt in de bundle.' }
          if (-not (Test-Path (Join-Path $contents 'Enexis.KabelChecker.Core.dll'))) { throw 'Core DLL ontbreekt in de bundle.' }
          if (-not (Test-Path (Join-Path $contents 'ClosedXML.dll'))) { throw 'ClosedXML DLL ontbreekt in de bundle.' }

          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnexisKabelChecker-AutoCAD-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $zip = '${{ steps.package.outputs.zip }}'
          $title = "Enexis Kabel Checker v$version - AutoCAD 2025/2026"
          $notes = @"
          Release vanaf v1.7.1 met ondersteuning voor meerdere opgeslagen richtingen en Excel-export.

          Nieuw:
          - richtingen opslaan, wijzigen en verwijderen
          - per richting een ingevulde Ontwerpstroom_kabel-tab
          - per richting een Controle-kabel-tab op basis van het gekozen profiel
          - opgetelde Ontwerpstroom_trafo over alle richtingen
          - Excel-koppeling op woningtype/aantal

          Installeren:
          1. Download en pak de ZIP uit.
          2. Sluit AutoCAD.
          3. Dubbelklik INSTALLEREN.bat en bevestig de UAC-melding.
          4. Start AutoCAD 2025 of 2026.
          5. Typ ENEXISKABELCHECK.
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title $title --notes $notes
          }
